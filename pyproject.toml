[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipatlas"
version = "1.1.4"
description = "AI-powered video semantic indexing, annotation, retrieval and rough-cut system."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentimelineio>=0.18,<0.19",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "scenedetect>=0.7.1,<0.8",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
clipatlas = "clipatlas.cli:main"

[project.optional-dependencies]
jianying = [
  "pyjianyingdraft>=0.3,<0.4",
]
video-embedding = [
  "dashscope>=1.25.17,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pyjianyingdraft>=0.3,<0.4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["clipatlas*"]

[tool.setuptools.package-data]
"clipatlas.hypit" = ["wavespeed_provider/**/*.json", "wavespeed_provider/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["modules/finecut"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["clipatlas/vendor"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["^clipatlas/vendor/"]
