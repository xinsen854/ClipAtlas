name: Visual Timeline Global Match

on:
  push:
    branches:
      - visual-timeline-global-match-v1
      - feat/auto-director-story-skill-v0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visual-timeline-global-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Focused regression tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/api/test_segment_fallback_roles_api.py \
            tests/catalog/test_segment_fallback_roles.py \
            tests/catalog/test_timeline_protocol.py \
            tests/director/test_director_prompt_contract.py \
            tests/director/test_requirements_alignment.py \
            tests/director/test_reranker.py \
            tests/director/test_spoken_anchor_contract.py \
            tests/retrieval/test_reranked_rough_cut.py \
            tests/retrieval/test_segment_fallback_search.py \
            tests/retrieval/test_timeline_bilingual_normalization.py \
            tests/retrieval/test_media_filter.py \
            tests/roughcut/test_batch_assignment.py \
            tests/roughcut/test_batch_reuse.py \
            tests/roughcut/test_candidate_matrix.py \
            tests/roughcut/test_evidence_quality.py \
            tests/roughcut/test_global_assignment.py \
            tests/roughcut/test_spoken_anchor_alignment.py \
            tests/roughcut/test_roughcut_beats.py \
            tests/roughcut/test_story_execution_core.py \
            tests/speech/test_narration_store.py \
            tests/speech/test_story_audio_gaps.py \
            2>&1 | tee focused-pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Full Python test suite
        id: full
        if: steps.focused.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee full-pytest.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pytest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            focused-pytest.log
            full-pytest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Enforce test gate
        if: always()
        shell: bash
        run: |
          focused="${{ steps.focused.outputs.exit_code }}"
          full="${{ steps.full.outputs.exit_code }}"
          if [ "$focused" != "0" ]; then
            echo "Focused regression suite failed: $focused"
            exit 1
          fi
          if [ "$full" != "0" ]; then
            echo "Full Python suite failed or did not run cleanly: $full"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:run
